  /crm/stock/search:
    get:
      operationId: searchStock
      tags: [crm]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Cross-entity search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }
  /crm/reports:
    get:
      operationId: getStockReport
      tags: [crm]
      parameters:
        - name: report
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv, xlsx, pdf] }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Report data or exported file
          content:
            application/json:
              schema: {}
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
