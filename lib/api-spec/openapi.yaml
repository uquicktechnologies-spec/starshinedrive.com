components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ActiveOnly:
      name: activeOnly
      in: query
      required: false
      description: When true, only return rows whose status/active flag is Active/true (used by selection dropdowns; admin screens omit this to manage all rows).
      schema: { type: boolean }
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Customer:
      type: object
      required: [id, companyName, country, leadSource, createdAt, updatedAt]
